[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domainia"
version = "1.0.0"
description = "Domains, linear maps, covariance operators and Gaussian likelihoods over the WDM transform (paper release)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Johnson" }]
dependencies = [
    "wdm-paper==1.0.0",
    "numpy>=2.1,<3",
    "scipy>=1.14.1,<2",
]

[project.optional-dependencies]
jax = ["jax>=0.9", "jaxlib>=0.9"]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/domainia"]

[tool.pytest.ini_options]
# Any pytest invocation whose arguments lie inside packages/domainia (from here or from
# the release root) picks THIS file as its config, not the root pytest.ini; so it
# carries its own import path (domainia + the sibling wdm release) and never writes
# .pytest_cache.  tests/ has no __init__.py: packages/wdm/tests already owns the
# top-level name ``tests`` in a root run, so every file here is test_dom_*.py.
testpaths = ["tests"]
pythonpath = ["src", "../wdm/src"]
addopts = "-ra -p no:cacheprovider"
xfail_strict = true
markers = [
    "jax: needs jax; skipped when jax is not importable",
    "golden: reads the release goldens (golden/) or shipped data (data/)",
]
