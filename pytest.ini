[pytest]
addopts = -p no:cacheprovider -ra -m "not golden_full and not slow"
testpaths = tests packages/wdm/tests packages/domainia/tests packages/wdm_models/tests
pythonpath = . packages/wdm/src packages/domainia/src packages/wdm_models/src
markers =
    golden: fast-tier golden checks (run by default)
    golden_full: full-tier golden checks (opt-in; local runs need user approval)
    legacy: spawns a frozen-lineage subprocess (skips when the frozen trees are absent)
    jax: needs jax
    slow: long read-only I/O checks such as the full frozen-tree re-hash (opt-in)
